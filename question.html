<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questions and Answers | Wahiduddin Khan Library</title>
<meta name="description" content="Ask a question, give an answer and reply in English, Hindi or Urdu. A free public discussion about the books and ideas of Maulana Wahiduddin Khan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--surface:#FFF;--ink:#12242E;--muted:#506673;--line:#D5DEE4;--accent:#0E6B73;--accent-ink:#FFF;--hot:#C2570C;--hot-ink:#FFF;--chip:#E4ECF0;
--serif:'Newsreader',Georgia,serif;--sans:'Figtree',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A141B;--surface:#112029;--ink:#E8EEF1;--muted:#9DB1BC;--line:#233844;--accent:#4FC3C9;--accent-ink:#062126;--hot:#F0A24A;--hot-ink:#1B1204;--chip:#162A35}}
:root[data-theme="dark"]{--bg:#0A141B;--surface:#112029;--ink:#E8EEF1;--muted:#9DB1BC;--line:#233844;--accent:#4FC3C9;--accent-ink:#062126;--hot:#F0A24A;--hot-ink:#1B1204;--chip:#162A35}
html{height:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.l-ur{font-family:'Noto Nastaliq Urdu',var(--serif);line-height:2.15}.l-hi{font-family:'Noto Sans Devanagari',var(--sans);line-height:1.75}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.25rem}
header.top{position:sticky;top:0;z-index:30;background:linear-gradient(#07121A,#0C2430);color:#EAF1F4;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 20px #0005}
.bar{display:flex;align-items:center;gap:.9rem;min-height:64px}
.brand{font:500 1.2rem var(--serif);text-decoration:none;white-space:nowrap}
nav.m{display:flex;gap:.15rem}nav.m a{padding:.5rem .75rem;border-radius:999px;text-decoration:none;font-size:.93rem;opacity:.85}
nav.m a:hover{background:#ffffff1c;opacity:1}nav.m a.on{background:#ffffff26;opacity:1;font-weight:600}
.sb{flex:1;max-width:560px;margin-inline:auto}
.sb input{width:100%;border:0;border-radius:12px;background:#F7FAFB;color:#12242E;padding:.7rem 1rem;font-size:1rem;box-shadow:0 0 0 1px #ffffff30}
.sb input:focus{outline:none;box-shadow:0 0 0 3px #4FC3C9}
.hot{border:0;border-radius:12px;background:var(--hot);color:var(--hot-ink);font-weight:700;padding:.65rem 1.1rem;cursor:pointer;white-space:nowrap}.hot:hover{filter:brightness(1.07)}
.tb{border:1px solid #ffffff38;background:#ffffff14;border-radius:999px;height:38px;padding:0 .9rem;cursor:pointer;color:#EAF1F4}
@media(max-width:860px){nav.m{display:none}}
@media(max-width:560px){.bar{flex-wrap:wrap;padding:.6rem 0}.sb{order:3;flex-basis:100%;max-width:none}.brand{margin-inline-end:auto}}
.cols{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:1.4rem;align-items:start;padding:1.4rem 0 3rem}
@media(max-width:1020px){.cols{grid-template-columns:minmax(0,1fr) 290px}.left{display:none}}
@media(max-width:780px){.cols{grid-template-columns:1fr}}
.left,.right{position:sticky;top:84px}@media(max-width:780px){.right{position:static}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.9rem}
.box h2{font:600 .95rem var(--sans);margin:0 0 .5rem}.box ul{list-style:none;margin:0;padding:0}
.tp button{display:block;width:100%;text-align:start;border:0;background:none;padding:.42rem .6rem;border-radius:8px;cursor:pointer;font-size:.93rem}
.tp button:hover{background:var(--chip)}.tp button.on{background:var(--chip);font-weight:700;color:var(--accent)}
.st{display:flex;justify-content:space-between;font-size:.9rem;padding:.2rem 0;color:var(--muted)}.st b{color:var(--ink)}
.askcard{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#12404A,#2C7A7B);color:#fff;display:grid;place-items:center;font-weight:700}
.fake{flex:1;border:1px solid var(--line);border-radius:999px;padding:.6rem 1rem;color:var(--muted);background:var(--bg);text-align:start;cursor:pointer}
.flt{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.8rem}
.flt button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .95rem;cursor:pointer;font-weight:600;font-size:.9rem}
.flt button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.flt .sep{width:1px;height:22px;background:var(--line);margin:0 .3rem}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:.9rem;cursor:pointer;transition:border-color .2s}
.qc:hover{border-color:var(--accent)}
.qc h3{font:500 1.3rem/1.35 var(--serif);margin:.4rem 0}.qc.l-ur h3,.qc .l-ur{font-family:'Noto Nastaliq Urdu',var(--serif)}
.meta{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--muted)}
.tag{background:var(--chip);color:var(--ink);border-radius:999px;padding:.05rem .65rem;font-size:.78rem}.lg{border:1px solid var(--line);border-radius:6px;padding:0 .45rem;font-size:.75rem;font-weight:700}
.top1{margin:.7rem 0 .5rem;padding:.7rem .9rem;background:var(--bg);border-radius:10px}
.top1 .who{font-size:.85rem;font-weight:600}.top1 p{margin:.2rem 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.foot{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.86rem}
.ans{color:var(--accent);font-weight:700}.none{color:var(--hot);font-weight:700}
.link{border:0;background:var(--chip);border-radius:999px;padding:.3rem .85rem;cursor:pointer;font-weight:600;font-size:.85rem}
.related li{padding:.55rem 0;border-top:1px solid var(--line)}.related li:first-child{border-top:0}
.related a{text-decoration:none;cursor:pointer}.related a:hover{color:var(--accent)}.related small{display:block;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin:.3rem 0}
.back{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:.2rem 0 .6rem}
.qv h1{font:400 clamp(1.5rem,3vw,2.1rem)/1.3 var(--serif);margin:.4rem 0}.qv .body{white-space:pre-wrap;overflow-wrap:anywhere;margin:.5rem 0}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.acts button{border:0;background:var(--chip);border-radius:999px;padding:.35rem .9rem;font:600 .85rem var(--sans);cursor:pointer}.acts button.on{background:var(--accent);color:var(--accent-ink)}
.comp textarea,.reply input,.mdl input,.mdl textarea,.mdl select,.comp select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:.75rem .9rem}
.comp textarea{min-height:110px;resize:vertical}.comp .row{display:flex;gap:.6rem;align-items:center;margin-top:.6rem}.comp select{width:auto}
.answer{border-top:1px solid var(--line);padding:1rem 0}.answer .who,.cmt .who{font-weight:600;font-size:.92rem}
.answer p.t{white-space:pre-wrap;overflow-wrap:anywhere;margin:.3rem 0}
.thread{margin-top:.8rem;padding-inline-start:1rem;border-inline-start:2px solid var(--line);display:grid;gap:.8rem}
.cmt p{margin:.15rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{display:flex;gap:.5rem;margin-top:.6rem}.reply button{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 1rem;cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:1.6rem;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:80;background:#050C11bb;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}.ov.open{display:flex}
.mdl{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:1.4rem;display:grid;gap:.8rem}
.mdl h2{font:400 1.5rem var(--serif);margin:0}.mdl textarea{min-height:100px;resize:vertical}.mdl .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mdl .end{display:flex;gap:.6rem;justify-content:flex-end;align-items:center}.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:.65rem 1.1rem;cursor:pointer;font-weight:600}
.mode{font-size:.82rem;color:var(--muted);margin:.6rem 0 0}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:1480px}
.cols{grid-template-columns:280px minmax(0,1fr) 360px;gap:2.6rem;padding-top:1.8rem}
@media(max-width:1180px){.cols{grid-template-columns:minmax(0,1fr) 320px;gap:2rem}}
@media(max-width:780px){.cols{grid-template-columns:1fr}}
.mchips{display:none;gap:.4rem;overflow-x:auto;padding-bottom:.8rem;scrollbar-width:thin}.mchips button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:.3rem .85rem;cursor:pointer;font-size:.86rem}.mchips button.on{background:var(--chip);border-color:var(--accent);font-weight:700}
@media(max-width:1180px){.mchips{display:flex}}
.box{padding:1.2rem 1.3rem}.box h2{font-size:1rem;margin-bottom:.7rem}
.tp button{padding:.55rem .7rem;font-size:.97rem}
.flt{margin:.2rem 0 .4rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
.qc{background:none;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:1.5rem 0 1.1rem;margin:0;cursor:pointer}
.qc:hover{border-color:var(--line);transform:none}
.qt{font:500 clamp(1.35rem,2.2vw,1.65rem)/1.35 var(--serif);color:var(--accent);margin:.5rem 0 .4rem;letter-spacing:-.005em}
.qc:hover .qt{text-decoration:underline;text-underline-offset:4px}
.pre{margin:.5rem 0 .2rem;padding-inline-start:.9rem;border-inline-start:3px solid var(--line)}
.pre .who{font-size:.86rem;font-weight:700}.pre p{margin:.2rem 0 0;color:var(--ink);opacity:.88;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bar2,.acts{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.bar2 button,.acts button{display:inline-flex;align-items:center;gap:.45rem;border:0;background:none;color:var(--muted);border-radius:999px;padding:.5rem .85rem;font:600 .9rem var(--sans);cursor:pointer;transition:background .15s,color .15s}
.bar2 button:hover,.acts button:hover{background:var(--chip);color:var(--ink)}
.bar2 button.on,.acts button.on{color:var(--hot);background:none}.bar2 button.on svg{fill:var(--hot);stroke:var(--hot)}
.bar2 .sp{margin-inline-start:auto;font-size:.84rem;color:var(--muted)}
.none{color:var(--hot);font-weight:600}.ans{color:var(--muted);font-weight:600}
.qv .box.q0{background:none;border:0;padding:0}
.answer{padding:1.3rem 0}.qv h2.ah{font:500 1.15rem var(--sans);margin:1.6rem 0 0;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.right ol{margin:0;padding:0;list-style:none;counter-item:c}.right ol li{display:flex;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line)}.right ol li:first-child{border-top:0}
.right ol li::before{counter-increment:c;content:counter(c);flex:none;font:500 1.3rem/1 var(--serif);color:var(--hot);width:1.2rem}
.right ol a{text-decoration:none;cursor:pointer;font-weight:600;line-height:1.35}.right ol a:hover{color:var(--accent)}.right ol small{display:block;color:var(--muted);font-weight:400}
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="https://claude.ai/artifact/1RC8XvPpzFPxuiyWqFeP1d">Wahiduddin Khan Library</a>
  <div class="sb"><input id="gs" type="search" placeholder="Search questions or ask a new one..." aria-label="Search questions"></div>
  <nav class="m" aria-label="Primary"><a href="https://claude.ai/artifact/1RC8XvPpzFPxuiyWqFeP1d">Home</a><a href="https://claude.ai/artifact/52DrMXF5iGzPK1mjsXJCdW">Books</a><a class="on" href="#">Questions</a></nav>
  <button class="hot" type="button" id="addq">Add question</button>
  <button class="tb" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
</div></header>

<main class="wrap"><div class="cols">
  <aside class="left" id="left"></aside>
  <section id="col" aria-live="polite"></section>
  <aside class="right" id="right"></aside>
</div></main>
<footer><div class="wrap">Answers here are community answers. Quote the author only with the book and page. Unsourced quotations may be removed later by moderators.</div></footer>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mdl">
  <h2 id="mh">Add question</h2>
  <input id="mt" maxlength="140" placeholder="Start your question with What, How, Why, Where..." aria-label="Question">
  <textarea id="mb" maxlength="1500" placeholder="Add details (optional)" aria-label="Details"></textarea>
  <div class="two"><select id="mtopic" aria-label="Topic"></select><select id="mlang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ur">اردو</option></select></div>
  <div class="end"><button class="ghost" type="button" id="mx">Cancel</button><button class="hot" type="button" id="mp">Post question</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOP=["Islam and Peace","Quran and Hadith","Spirituality","God and Faith","Life After Death","Patience and Forgiveness","Nonviolence","Interfaith","Women and Family","Education","Science and Religion","Personal Development","Which Book to Read","General"];
const LG={en:"English",hi:"हिन्दी",ur:"اردو"},BOOKS="https://claude.ai/artifact/52DrMXF5iGzPK1mjsXJCdW";
let db=null,uid="local",docs=[],names={},open=null,tab="latest",topic="",lang="",term="";
$("#mtopic").innerHTML=TOP.map(t=>`<option>${esc(t)}</option>`).join("");
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?"just now":s<3600?Math.floor(s/60)+" min ago":s<86400?Math.floor(s/3600)+" h ago":Math.floor(s/86400)+" d ago"};
const nm=u=>u==="local"?"You":u==="library"?"Library team":(names[u]||"Member");
const lc=d=>"l-"+(d.lang||"en"),lb=d=>`<span class="lg">${(d.lang||"en").toUpperCase()}</span>`;
const Q=()=>docs.filter(d=>d.kind==="q"),A=q=>docs.filter(d=>d.kind==="a"&&d.qid===q.id),L=d=>(d.likes||[]).length;
const best=q=>[...A(q)].sort((a,b)=>L(b)-L(a)||a.ts-b.ts)[0];
const lk=d=>`<button type="button" class="${(d.likes||[]).includes(uid)?"on":""}" data-like="${d.id}">Helpful${L(d)?" "+L(d):""}</button>`;
const words=s=>new Set(s.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>3));
function related(q){const w=words(q.title);return Q().filter(x=>x.id!==q.id).map(x=>{let s=x.topic===q.topic?2:0;words(x.title).forEach(t=>{if(w.has(t))s++});return[s,x]}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,6).map(a=>a[1])}
const SV=p=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={like:SV('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),com:SV('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),sh:SV('<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/>')};
const lkb=d=>`<button type="button" class="${(d.likes||[]).includes(uid)?"on":""}" data-like="${d.id}">${IC.like}<span>${L(d)||"Like"}</span></button>`;
const ncom=q=>A(q).length+docs.filter(d=>d.kind==="c"&&d.qid===q.id).length;
function side(){const cur=open&&docs.find(d=>d.id===open);const top=[...Q()].sort((a,b)=>A(b).length+L(b)-A(a).length-L(a)||b.ts-a.ts).slice(0,6),rel=cur?related(cur):[];
 const li=x=>`<li><div><a data-q="${x.id}" class="${lc(x)}" dir="auto">${esc(x.title)}</a><small>${A(x).length} answer${A(x).length===1?"":"s"} · ${esc(x.topic||"General")}</small></div></li>`;
 const lbt=(k,l)=>`<button type="button" data-lang="${k}" class="${lang===k?"on":""}">${l}</button>`;
 $("#left").innerHTML=`<div class="box tp"><h2>Topics</h2><button type="button" data-topic="" class="${topic?"":"on"}">All topics</button>${TOP.map(t=>`<button type="button" data-topic="${esc(t)}" class="${topic===t?"on":""}">${esc(t)}</button>`).join("")}</div>
 <div class="box"><h2>Community</h2><div class="st">Questions<b>${Q().length}</b></div><div class="st">Answers<b>${docs.filter(d=>d.kind==="a").length}</b></div><div class="st">Replies<b>${docs.filter(d=>d.kind==="c").length}</b></div></div>
 <div class="box"><h2>Explore</h2><p class="hint">Browse every book by language and open it on the official source.</p><a class="hot" style="display:inline-block;text-decoration:none" href="${BOOKS}">Browse books</a></div>`;
 $("#right").innerHTML=`<div class="box"><h2>Filter by language</h2><div class="flt" style="border:0;margin:0;padding:0">${lbt("","All")}${lbt("en","English")}${lbt("hi","हिन्दी")}${lbt("ur","اردو")}</div></div>
 ${rel.length?`<div class="box"><h2>Related questions</h2><ol>${rel.map(li).join("")}</ol></div>`:""}
 <div class="box"><h2>Top questions</h2>${top.length?`<ol>${top.map(li).join("")}</ol>`:`<p class="hint">Top questions will appear here once people start asking.</p>`}</div>
 <div class="box"><h2>Guidelines</h2><p class="hint">Be respectful. Name the book and page when you quote. No spam, abuse or impersonation.</p></div>
 <p class="mode">${db?"Live: shared with everyone who can open this page.":"Preview mode: posts stay on this device until sharing is connected."}</p>`}
function cm(c,all,d){const kids=all.filter(x=>x.parent===c.id).sort((a,b)=>a.ts-b.ts);
 return `<div class="cmt"><div class="who">${esc(nm(c.uid))} <span class="meta">${ago(c.ts)}</span></div><p dir="auto" class="${lc(c)}">${esc(c.text)}</p><div class="acts">${lkb(c)}${d<3?`<button type="button" data-rp="${c.id}">Reply</button>`:""}<button type="button" data-rep="${c.id}">${c.reported?"Reported":"Report"}</button></div><div id="rp-${c.id}"></div>${kids.length?`<div class="thread">${kids.map(k=>cm(k,all,d+1)).join("")}</div>`:""}</div>`}
function feed(){let r=Q();if(topic)r=r.filter(q=>q.topic===topic);if(lang)r=r.filter(q=>(q.lang||"en")===lang);
 if(term)r=r.filter(q=>(q.title+" "+(q.text||"")).toLowerCase().includes(term));
 if(tab==="latest")r.sort((a,b)=>b.ts-a.ts);else if(tab==="top")r.sort((a,b)=>A(b).length-A(a).length||b.ts-a.ts);else r=r.filter(q=>!A(q).length).sort((a,b)=>b.ts-a.ts);
 const tb=(k,l)=>`<button type="button" data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`;
 $("#col").innerHTML=`<div class="box askcard" id="ask"><div class="av">${uid==="local"?"Y":"M"}</div><div class="fake">What do you want to ask or share?</div><button class="hot" type="button">Ask</button></div>
 <div class="mchips"><button type="button" data-topic="" class="${topic?"":"on"}">All topics</button>${TOP.map(t=>`<button type="button" data-topic="${esc(t)}" class="${topic===t?"on":""}">${esc(t)}</button>`).join("")}</div>
 <div class="flt">${tb("latest","Latest")}${tb("top","Most answered")}${tb("none","Unanswered")}</div>`+
 (r.length?r.map(q=>{const n=A(q).length,b=best(q);return `<article class="qc" data-q="${q.id}"><div class="meta"><span class="tag">${esc(q.topic||"General")}</span>${lb(q)}<span>${esc(nm(q.uid))}</span><span>${ago(q.ts)}</span></div><h3 class="qt ${lc(q)}" dir="auto">${esc(q.title)}</h3>
 ${b?`<div class="pre"><div class="who">${esc(nm(b.uid))} ${lb(b)}</div><p dir="auto" class="${lc(b)}">${esc(b.text)}</p></div>`:`<span class="none">No answers yet. Be the first to answer.</span>`}
 <div class="bar2">${lkb(q)}<button type="button" data-q="${q.id}">${IC.com}<span>${ncom(q)||"Comment"}</span></button><button type="button" data-share="${q.id}">${IC.sh}<span>Share</span></button><span class="sp">${n} answer${n===1?"":"s"}</span></div></article>`}).join(""):`<div class="empty"><b>No questions yet.</b><p>Be the first to ask. Press “Add question” at the top.</p></div>`)}
function detail(){const q=docs.find(d=>d.id===open);if(!q){open=null;return feed()}
 const as=A(q).sort((a,b)=>L(b)-L(a)||a.ts-b.ts),cs=docs.filter(d=>d.kind==="c"&&d.qid===q.id);
 $("#col").innerHTML=`<div class="qv"><button class="back" type="button" data-back>&larr; All questions</button><div class="meta"><span class="tag">${esc(q.topic||"General")}</span>${lb(q)}<span>${esc(nm(q.uid))}</span><span>${ago(q.ts)}</span></div><h1 class="qt ${lc(q)}" dir="auto" style="font-size:clamp(1.6rem,3vw,2.2rem)">${esc(q.title)}</h1>${q.text?`<div class="body ${lc(q)}" dir="auto">${esc(q.text)}</div>`:""}
 <div class="bar2">${lkb(q)}<button type="button" data-focus>${IC.com}<span>${as.length} answer${as.length===1?"":"s"}</span></button><button type="button" data-share="${q.id}">${IC.sh}<span>Share</span></button><button type="button" data-rep="${q.id}">${q.reported?"Reported":"Report"}</button></div>
 <div class="box comp" style="margin-top:1.2rem"><h2>Your answer</h2><textarea id="ab" dir="auto" maxlength="3000" placeholder="Write a clear, respectful answer in English, Hindi or Urdu. If you quote the author, add the book and page." aria-label="Your answer"></textarea><div class="row"><select id="al" aria-label="Answer language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ur">اردو</option></select><button class="hot" type="button" id="apost">Post answer</button></div></div>
 <h2 class="ah">${as.length} answer${as.length===1?"":"s"}</h2>${as.length?as.map(a=>{const roots=cs.filter(c=>c.parent===a.id).sort((x,y)=>x.ts-y.ts);return `<div class="answer"><div class="who">${esc(nm(a.uid))} ${lb(a)} <span class="meta">Community answer · ${ago(a.ts)}</span></div><p class="t ${lc(a)}" dir="auto">${esc(a.text)}</p><div class="acts">${lkb(a)}<button type="button" data-rp="${a.id}">${IC.com}<span>Reply</span></button><button type="button" data-rep="${a.id}">${a.reported?"Reported":"Report"}</button></div><div id="rp-${a.id}"></div>${roots.length?`<div class="thread">${roots.map(c=>cm(c,cs,1)).join("")}</div>`:""}</div>`}).join(""):`<p class="hint" style="padding:1rem 0">No answers yet. You can write the first one above.</p>`}</div>`;
 const al=$("#al");if(al)al.value=q.lang||"en"}
function render(){open?detail():feed();side()}
async function add(o){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),d={...o,id,uid,ts:Date.now(),likes:[]};
 if(db){try{await db.collection("qa").doc(id).set(d)}catch(e){alert("Could not post. You may not have permission to write here.");return null}}else{docs.push(d);render()}return id}
function mut(id,fn){const p=docs.find(x=>x.id===id);if(!p)return;const u=fn(p);if(db)db.collection("qa").doc(id).update(u).catch(()=>{});else{Object.assign(p,u);render()}}
function go(id){open=id;try{history.replaceState(null,"",id?"#q="+id:location.pathname)}catch(e){}render();scrollTo({top:0})}
function ask(t){$("#mt").value=t||"";$("#ov").classList.add("open");$("#mt").focus()}
const closeM=()=>$("#ov").classList.remove("open");
$("#addq").onclick=()=>ask($("#gs").value.trim());$("#mx").onclick=closeM;
$("#mp").onclick=async()=>{const t=$("#mt").value.trim();if(t.length<10){$("#mt").focus();return}
 const id=await add({kind:"q",title:t,text:$("#mb").value.trim(),topic:$("#mtopic").value,lang:$("#mlang").value});if(id){closeM();$("#mt").value="";$("#mb").value="";$("#gs").value="";term="";go(id)}};
$("#gs").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();open=null;feed();side()});
$("#gs").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("#gs").value.trim())ask($("#gs").value.trim())});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
document.addEventListener("click",e=>{if(e.target.id==="ov")return closeM();const b=e.target.closest("button,[data-q],#ask");if(!b)return;const d=b.dataset;
 if(b.id==="ask"||b.closest("#ask"))return ask("");
 if(d.q)return go(d.q);if("back" in d)return go(null);
 if(d.tab){tab=d.tab;return render()}if(d.lang!==undefined&&b.closest(".flt")){lang=d.lang;return render()}
 if(d.topic!==undefined){topic=d.topic;open=null;return render()}
 if(d.like)mut(d.like,p=>{const l=(p.likes||[]).slice(),i=l.indexOf(uid);i<0?l.push(uid):l.splice(i,1);return{likes:l}});
 else if(d.rep)mut(d.rep,()=>({reported:true}));
 else if(b.id==="apost"){const v=$("#ab").value.trim();if(v.length<5)return $("#ab").focus();add({kind:"a",text:v,qid:open,lang:$("#al").value})}
 else if(d.share){const u=location.href.split("#")[0]+"#q="+d.share,t=b.querySelector("span");(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>t.textContent="Link copied").catch(()=>t.textContent="Copy from address bar")}
 else if("focus" in d){$("#ab").focus()}
 else if(d.rp){const h=$("#rp-"+d.rp);if(h.innerHTML){h.innerHTML="";return}h.innerHTML=`<div class="reply"><input dir="auto" maxlength="1000" placeholder="Write a reply" aria-label="Reply"><button type="button">Send</button></div>`;const i=h.querySelector("input");i.focus();
  const send=()=>{const v=i.value.trim();if(!v)return;const p=docs.find(x=>x.id===d.rp);add({kind:"c",text:v,qid:open,parent:p.id,lang:p.lang||"en"})};h.querySelector("button").onclick=send;i.onkeydown=ev=>{if(ev.key==="Enter")send()}}});
$("#theme").onclick=()=>{const r=document.documentElement,x=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0A141B",v=x?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("mwk-theme",v)}catch(e){}};
try{const t=localStorage.getItem("mwk-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
if(location.hash.startsWith("#q="))open=location.hash.slice(3);
render();
(async()=>{try{if(typeof claude==="undefined")return;const d=await claude.use("db"),u=await claude.use("user");if(!d)return;db=d;if(u){window.__u=u;try{uid=await u.id()}catch(e){}}
 db.collection("qa").orderBy("ts","desc").limit(500).onSnapshot(async s=>{docs=s.docs.map(x=>x.data());
  try{if(window.__u){const ids=[...new Set(docs.map(x=>x.uid))].filter(x=>x!=="library");const ps=await window.__u.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||"Member")}}catch(e){}render()},()=>{})}catch(e){}})();
</script>
</body>
